# Local-only stack: Actual sync-server + thin pipeline database + pipeline service.
# n8n runs separately (its own compose); this stack joins n8n's network so that
# n8n can reach the pipeline as http://pipeline:8000.

services:
  actual:
    image: actualbudget/actual-server:26.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - actual-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5006/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  pipeline-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pipeline-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 12

  pipeline:
    build: .
    image: personal-budget-pipeline:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD}@pipeline-db:5432/pipeline
      ACTUAL_URL: http://actual:5006
      ACTUAL_DATA_DIR: /data/actual-cache
      INBOX_DIR: /inbox
      SOURCES_FILE: /config/sources.yaml
      MIGRATIONS_DIR: /app/migrations
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./inbox:/inbox
      - ./sources.yaml:/config/sources.yaml:ro
      - pipeline-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - n8n
    depends_on:
      actual:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy

volumes:
  actual-data:
  pipeline-db-data:
  pipeline-data:

networks:
  default:
  n8n:
    name: ${N8N_NETWORK:-n8n_default}
    external: true
