# SPDX-License-Identifier: Apache-2.0
[project]
name = "personal-budget-pipeline"
version = "0.1.0"
description = "Pluggable source connectors and an idempotent importer into Actual Budget, with a thin Postgres pipeline-state store"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "actualpy==0.22.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running Postgres/Actual (deselected by default)"]
addopts = "-m 'not integration'"
